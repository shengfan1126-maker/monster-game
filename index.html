<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>權能進化・魔物篇</title>
<style>
:root{
  --bg:#f2efe9;--card:#fffdf9;--ink:#1f1e1c;--ink2:#3a3833;--mute:#7a766e;--line:#ddd7cb;--chip:#cbc5ba;
  --soft:#eee8dc;--gold:#8a6d2f;--on-ink:#f2efe9;--bad:#9b3a2e;--bad-bg:#f6e4df;--good:#2f6b62;--good-bg:#dcede8;
  --stone:#4d5a52;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1a1917;--card:#242220;--ink:#ece7de;--ink2:#d3cdc2;--mute:#a39d92;--line:#3a3733;--chip:#4d4942;
  --soft:#2e2b28;--gold:#d0b06a;--on-ink:#1a1917;--bad:#e08a7d;--bad-bg:#3a2522;--good:#7cc2b6;--good-bg:#1f3330;
  --stone:#9fb3a7;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:"Noto Sans TC","PingFang TC","Hiragino Sans CNS","Microsoft JhengHei",sans-serif;
  color:var(--ink);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.app{max-width:640px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom))}

.hd{display:flex;align-items:baseline;gap:9px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.hd h1{font-size:19px;font-weight:900;letter-spacing:.03em}
.hd .sub{font-size:11.5px;color:var(--mute)}
.gear{margin-left:auto;background:none;border:none;font-size:19px;cursor:pointer;line-height:1}

/* 狀態列 */
.stat{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:9px 2px 8px;border-bottom:1px solid var(--line);font-size:13px}
.stat .nm{font-weight:900;font-size:15px}
.stat .k{color:var(--mute);font-size:11.5px;margin-right:2px}
.stat b{font-variant-numeric:tabular-nums}
.stat .loc{width:100%;font-size:12px;color:var(--mute)}

/* 分頁 */
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:none;padding:8px 13px 9px;font-size:14px;font-weight:700;color:var(--mute);
  cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.panel{padding-top:12px}

/* 故事 */
.log{display:grid;gap:12px}
.gm p{margin:0 0 .55em;font-size:15.5px;line-height:1.85;text-wrap:pretty}
.gm p:last-child{margin-bottom:0}
.sys{color:var(--gold);font-weight:700}
.you{justify-self:end;max-width:88%;background:var(--ink);color:var(--on-ink);border-radius:10px 10px 2px 10px;
  padding:7px 12px;font-size:14px;line-height:1.55;white-space:pre-wrap}
.by{font-size:10.5px;color:var(--mute);margin-top:4px}
.choices{margin-top:16px;display:grid;gap:7px}
.opt{text-align:left;background:var(--card);border:1.5px solid var(--ink);border-radius:5px;padding:10px 12px;
  font-size:14.5px;font-weight:700;cursor:pointer;line-height:1.45}
.opt:active{background:var(--ink);color:var(--on-ink)}
.opt:disabled{opacity:.4}
.free{display:flex;gap:7px;margin-top:4px}
.free textarea{flex:1;min-height:46px;max-height:140px;resize:vertical;border:1.5px solid var(--chip);border-radius:5px;
  padding:9px 10px;background:var(--card);font-size:14.5px;line-height:1.5}
.free textarea:focus{outline:none;border-color:var(--ink)}
.send{flex:0 0 auto;background:var(--ink);color:var(--on-ink);border:none;border-radius:5px;padding:0 16px;font-weight:800;cursor:pointer}
.send:disabled{opacity:.4}
.tools{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.tl{background:none;border:1px solid var(--line);color:var(--mute);border-radius:4px;padding:4px 10px;font-size:12px;cursor:pointer}
.wait{color:var(--mute);font-size:13.5px;padding:6px 0}
.wait::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"．"}50%{content:"．．"}75%{content:"．．．"}}
.err{background:var(--bad-bg);color:var(--bad);border-radius:5px;padding:9px 11px;font-size:13px;white-space:pre-wrap}
.err button{margin-top:7px;display:block}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 13px;margin-bottom:12px}
.card h3{font-size:10.5px;letter-spacing:.2em;color:var(--mute);font-weight:800;margin-bottom:6px}
.row{display:grid;grid-template-columns:4.2em 1fr;gap:2px 10px;font-size:14px;padding:2px 0}
.row .k{color:var(--mute);font-size:12.5px;font-weight:700}
.sk{display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid var(--soft)}
.sk:last-child{border-bottom:none}
.sk .n{font-weight:800;font-size:15px}
.sk .s{font-size:11.5px;color:var(--mute)}
.sk .lv{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.uniq{background:var(--gold);color:var(--on-ink);font-size:10.5px;font-weight:800;padding:0 6px;border-radius:3px;letter-spacing:.08em}
.trk{display:grid;grid-template-columns:2.6em 3.4em 1fr;gap:0 8px;align-items:center;padding:3px 0}
.trk .k{font-size:12.5px;color:var(--mute);font-weight:700}
.trk .v{font-weight:800}
.pips{display:flex;gap:4px}
.pip{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--chip)}
.pip.on{background:var(--stone);border-color:var(--stone)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{border-radius:3px;padding:1px 8px;font-size:12.5px;font-weight:700;background:var(--soft);color:var(--ink2)}
.tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.good{background:var(--good-bg);color:var(--good)}
.npc{padding:8px 0;border-bottom:1px solid var(--soft)}
.npc:last-child{border-bottom:none}
.npc .h{display:flex;gap:8px;align-items:baseline}
.npc .h b{font-size:15px}
.npc .h span{font-size:12px;color:var(--mute)}
.npc .d{font-size:13px;color:var(--ink2)}
.empty{font-size:13px;color:var(--mute)}

/* 開始畫面 */
.start{margin-top:26px;text-align:center}
.start h2{font-size:22px;font-weight:900;margin-bottom:6px}
.start p{font-size:13.5px;color:var(--mute);margin-bottom:18px}
.start input{width:100%;max-width:320px;border:1.5px solid var(--ink);border-radius:5px;padding:11px;text-align:center;
  font-size:16px;background:var(--card)}
.big{display:block;width:100%;max-width:320px;margin:12px auto 0;background:var(--ink);color:var(--on-ink);border:none;
  border-radius:5px;padding:13px;font-weight:900;font-size:16px;letter-spacing:.1em;cursor:pointer}
.ghost{display:block;width:100%;max-width:320px;margin:8px auto 0;background:none;border:1px solid var(--line);
  border-radius:5px;padding:10px;color:var(--mute);cursor:pointer;font-size:13.5px}

/* 設定 */
.sheet{position:fixed;inset:0;background:rgba(31,30,28,.5);z-index:40;display:none}
.sheet.open{display:block}
.sbox{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:14px 14px 0 0;max-height:92vh;overflow:auto;
  padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.sbox h3{font-size:16px;font-weight:900;margin-bottom:3px}
.sbox h4{font-size:12px;letter-spacing:.15em;color:var(--mute);margin:18px 0 6px;font-weight:800}
.note{font-size:12px;color:var(--mute);line-height:1.65}
.sbox label{display:block;font-size:11.5px;color:var(--mute);font-weight:700;margin:10px 0 4px}
.sbox input[type=password],.sbox textarea{width:100%;font-size:14px;padding:11px;border:1px solid var(--chip);border-radius:4px;background:var(--card)}
.sbox textarea{resize:vertical;line-height:1.5;font-size:13px}
.pick{width:100%;margin-top:9px;background:var(--card);border:1px solid var(--chip);font-size:13px;padding:9px;border-radius:4px;cursor:pointer}
.mlist{margin-top:9px;max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:4px;background:var(--card)}
.mrow{display:flex;gap:9px;align-items:center;padding:9px 11px;border-bottom:1px solid var(--soft);cursor:pointer}
.mrow .nm2{flex:1;min-width:0}
.mrow .t1{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .t2{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .o2{font-size:11px;color:var(--gold);font-weight:700}
.mrow.has{opacity:.4}
.btnrow{display:flex;gap:7px;margin-top:6px}
.btnrow button{flex:1;background:var(--card);border:1.5px solid var(--ink);border-radius:4px;padding:10px;font-weight:700;font-size:13.5px;cursor:pointer}
.btnrow button.danger{border-color:var(--bad);color:var(--bad)}
.mseg{display:flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;margin-bottom:6px}
.mseg button{flex:1;background:var(--card);border:none;padding:9px;font-size:13px;color:var(--mute);cursor:pointer}
.mseg button.on{background:var(--ink);color:var(--on-ink);font-weight:700}
.gmtools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.gmtools .sw{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.gmtools .sw button{background:none;border:none;font-size:14px;padding:2px 7px;cursor:pointer;color:var(--ink2)}
.gmtools .by{margin:0 auto 0 0}
.youwrap{display:grid;justify-items:end;gap:3px}
.undo{background:none;border:none;color:var(--mute);font-size:12px;cursor:pointer;text-decoration:underline;padding:2px}
.edit textarea{width:100%;min-height:180px;border:1.5px solid var(--ink);border-radius:5px;padding:9px;background:var(--card);font-size:14.5px;line-height:1.7}
.edit .gmtools{justify-content:flex-end}
.close{width:100%;margin-top:18px;background:var(--ink);color:var(--on-ink);font-weight:800;padding:13px;border:none;border-radius:4px;cursor:pointer}
.stat{position:sticky;top:0;z-index:15;background:var(--bg)}
.totop{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;width:44px;height:44px;border-radius:50%;border:none;background:var(--ink);color:var(--on-ink);font-size:20px;font-weight:900;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer}
.stat .low b{color:var(--bad)}
.exits{margin:-2px 0 10px;display:flex;flex-wrap:wrap;gap:6px}
.exits .k{width:100%;font-size:12.5px;font-weight:800;color:var(--ink2)}
.exits .row{width:100%}.exits .note{width:100%}
.padd select{font:inherit;font-size:14px;padding:6px;border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--ink)}
.pip.off{opacity:.25}
.gm.ooc{border-left:3px dashed var(--chip);padding-left:10px;color:var(--ink2);font-size:14px}
.you.ooc{opacity:.75;border-style:dashed}
button.tag.ut{cursor:pointer;font:inherit}
.check.war{border-color:var(--bad)}
.check.evo{margin-bottom:12px}
.foe{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.foe b{font-size:15px;margin-right:6px}.foe span{font-size:12px;color:var(--mute)}.foe .d{font-size:13px;color:var(--ink2)}
.sacbox{margin-top:10px;display:grid;gap:5px;font-size:13px;font-weight:700}
.sacbox select{font:inherit;font-weight:500;padding:7px;border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--ink)}
.rtrow{margin-top:8px;text-align:right}
.rtbox{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;padding:8px;border:1px dashed var(--bad);border-radius:5px}
.rtbox .note{width:100%}
.gives{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-top:4px}
.pbtn{display:flex;gap:6px;margin-top:6px}
.padd{display:flex;gap:6px}.padd input{flex:1;min-width:0;font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--ink)}
.tg{display:inline-block;margin-right:4px;padding:0 6px;border-radius:3px;background:var(--soft);color:var(--ink2);font-size:11.5px}
.tg.bad{background:var(--bad-bg);color:var(--bad)}
.notes{margin-top:6px;padding:6px 10px;border-left:3px solid var(--gold);background:var(--soft);border-radius:0 4px 4px 0}
.notes p{font-size:13.5px!important;line-height:1.6!important;margin:0 0 .2em!important}
.sysgm p{font-size:14.5px}
.check{background:var(--card);border:1.5px solid var(--ink);border-radius:6px;padding:12px 13px}
.check h3{font-size:15px;font-weight:900;margin-bottom:6px}
.lay{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;margin-bottom:6px}
.lay .adv{color:var(--good)} .lay .dis{color:var(--bad)}
.need{font-size:13px;color:var(--ink2);margin-bottom:8px}
.costs{display:grid;gap:6px}
.cost{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:5px;cursor:pointer;font-size:14px;line-height:1.45}
.cost input{margin-top:3px;width:17px;height:17px;flex:0 0 auto}
.cost .eff{display:block;font-size:11.5px;color:var(--bad);margin-top:1px}
.cost.gen{color:var(--ink2);border-style:dashed}
.paybtn{width:100%;margin-top:10px;background:var(--ink);color:var(--on-ink);border:none;border-radius:5px;padding:12px;font-weight:800;font-size:15px;cursor:pointer}
.paybtn[data-t="失敗"]{background:var(--bad)}
.cands{display:grid;gap:7px}
.cands .cs{display:block;font-size:11.5px;font-weight:500;color:var(--mute);margin-top:2px}
.cands .tl{justify-self:end}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;margin-top:4px}
.mb{background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:9px 4px;font-weight:800;font-size:13.5px;cursor:pointer}
.mb:active{background:var(--ink);color:var(--on-ink)}
.eats{display:flex;flex-wrap:wrap;gap:6px}
.eat{background:var(--card);border:1.5px solid var(--gold);color:var(--gold);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer}
.eat small{margin-left:5px;font-weight:500;opacity:.8}
.eat.item{border-color:var(--chip);color:var(--ink2)}
.bag{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 4px;font-size:13px}
.bag .k{font-weight:800;color:var(--ink2);margin-right:2px}
.bag .it{background:var(--card);border:1px solid var(--chip);border-radius:6px;padding:3px 8px;color:var(--ink)}
.bag .none{color:var(--ink2);opacity:.7}
.bag .it{font:inherit;font-size:13px;cursor:default}
.bag button.it{cursor:pointer}
.bag .it.food{border-color:var(--gold);color:var(--gold);font-weight:700}
.bag .it.mat{border-color:#7a5cc4;color:#6a4cb4;font-weight:700}
.crow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:3px 0}
.bag .it.harv{border-style:dashed;border-color:var(--gold);color:var(--ink2)}
.bag .it small{margin-left:5px;font-weight:500;opacity:.8}
.bagnote{font-size:11.5px;color:var(--mute);margin:-2px 0 6px}
.dead{background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:14px;text-align:center;font-size:14px;line-height:1.7}
footer{margin-top:26px;font-size:11px;color:var(--mute);text-align:center;line-height:1.7}
</style>
</head>
<body>
<div class="app">
  <div class="hd">
    <h1>權能進化・魔物篇</h1><span class="sub">v0.23.2</span>
    <button class="gear" id="gear" aria-label="設定">⚙</button>
  </div>
  <div id="main"></div>
  <footer>規則與數值由程序管理，故事由你選的模型撰寫。<br>部分抽籤表來自《地城世界》（CC BY 3.0）與《危險荒野》（CC BY-SA 3.0）。</footer>
</div>

<button class="totop" id="totop" hidden aria-label="回到頁首">↑</button>
<div class="sheet" id="sheet">
  <div class="sbox">
    <h3>設定</h3>
    <div class="note">金鑰只留在這台裝置的瀏覽器裡。純前端網頁藏不住金鑰，填好的檔案別傳給別人。</div>
    <label>用哪一家</label>
    <div class="mseg" id="pseg"><button data-p="both">Gemini＋OpenRouter</button><button data-p="gemini">Gemini</button><button data-p="or">OpenRouter 免費</button></div>
    <div id="gembox">
      <label>Gemini API Key</label>
      <input type="password" id="gkey" placeholder="AIza…" autocomplete="off">
      <div class="note" id="geminfo"></div>
      <button class="pick" id="regem">重新抓 Gemini 模型名單</button>
    </div>
    <div id="orbox">
    <label>OpenRouter API Key</label>
    <input type="password" id="key" placeholder="sk-or-v1-…" autocomplete="off">
    <label>模型</label>
    <div class="mseg" id="mseg"><button data-m="auto">自動挑免費的</button><button data-m="list">自己排免費清單</button></div>
    <div id="autobox">
      <div class="note" id="autoinfo"></div>
      <button class="pick" id="refree">重新抓免費模型名單</button>
    </div>
    <div id="listbox">
      <textarea id="model" rows="3" spellcheck="false"></textarea>
      <div class="note">一行一個，從上往下試。只會送給免費模型，清單裡的付費模型會被跳過、不會送出。</div>
      <button class="pick" id="pick">列出現在免費的模型</button>
      <div id="freelist"></div>
    </div>
    </div>

    <h4>存檔</h4>
    <div class="note">遊戲每回合自動存在這個瀏覽器。換手機、換瀏覽器、清除瀏覽資料之前，先匯出存檔。</div>
    <div class="btnrow">
      <button id="exp">匯出存檔</button>
      <button id="imp">匯入存檔</button>
    </div>
    <div class="btnrow"><button class="danger" id="newg">重新開始</button></div>
    <div class="note" id="snote" style="margin-top:8px"></div>
    <input type="file" id="impfile" accept=".json,application/json" hidden>
    <button class="close" id="done">完成</button>
  </div>
</div>

<script>
/* ═════════ 工具 ═════════ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},
          d:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SAVE_KEY="mowu_save_v2";

/* ═════════ 世界資料 ═════════ */
const PROS=["赤貧","貧窮","普通","富裕","豪富"];
const POP=["離散","衰退","穩定","成長","興盛"];
const DEF=["沒人能打","幾隻能打的","守得住洞口","有像樣的獵手","有一群好手","一方強者","大部族"];
const TRACK_HINT={p:"存糧",pop:"哥布林數量",d:"能打的"};
const GRADES=["F","E","D","C","B","A","S"];
const gIdx=g=>Math.max(0,GRADES.indexOf(g||"F"));
const capOf=lv=>lv==="F"?3:lv==="E"?4:5;          // 技能等級上限：F3、E4、D 以上 5
const PERIOD=h=>h<5?"深夜":h<8?"清晨":h<11?"上午":h<14?"中午":h<17?"下午":h<19?"傍晚":"夜裡";
const isDay=h=>h>=6&&h<18;
const pad2=n=>String(n).padStart(2,"0");
const HUNGER={"幼體":{full:8,every:4},"成體":{full:24,every:24}};   // 吃飽撐幾小時／餓著每幾小時 HP -1
const hungerOf=()=>HUNGER[S.stage]||HUNGER["成體"];
const nowH=()=>S.day*24+S.hour;
const timeStr=()=>`第${S.day}天 ${pad2(S.hour)}:${pad2(S.min||0)}`;

function pathHours(from,to){                         // 只走已知的地點
  const d={[from]:0}, done=new Set();
  while(true){let u=null;for(const k in d)if(!done.has(k)&&(u==null||d[k]<d[u]))u=k;if(u==null)return null;if(u===to)return d[u];done.add(u);

}

    if(!was)notes&&notes.push(`發現新地點：${n}（${w[n].kind}，從${f}走 ${w[n].links[f]} 小時）`);return n}
  w[n]={kind:String(pl.kind||"地點").slice(0,6),region:pl._rg||(w[f]?w[f].region:"灰岩洞周邊"),note:String(pl.note||"").slice(0,60),links:{[f]:h},known:true,custom:true};

}

玩家要做的事結果不確定時（攻擊、搶奪、偷、攀爬、逃跑、躲藏、說服、硬闖危險……），或對手撲上來攻擊主角時，不要寫結果：narration 停在動手前的那一刻，連一點進展都不要先寫；options 給空陣列，並給 check：
{"what":"成功時會發生的結果，例如「打倒大哥布林」「拿走短矛不被發現」，不要寫「試著…」","foe":"對手名字或 null","foeLv":"對手等級 F/E/D… 或 null","skill":"主角最適合拿來用的一個技能名，或 null","adv":["主角的優勢理由（不含技能）"],"dis":["主角的劣勢理由，不含等級差"],"costs":[代價…]}
- costs 給 2~4 項，每項都是當下合理、真的會失去的東西，必須帶效果欄位：
  {"t":"描述","hp":-5} 受傷（對手打一下：F 級 3、E 級 5、D 級 8、C 級 12，代價的傷害要差不多）｜{"t":"描述","mp":-2}｜{"t":"描述","time":2} 多花幾小時（1~3）｜{"t":"描述","tag":"狀態名"} 留下狀態或關係，例如「流血」「被記恨（疤臉）」｜{"t":"描述","item":"玩家持有的物品名"} 失去物品
- 優勢來源：針對對方的弱點或性格、陷阱或工具、地形、人數。主角的技能不要寫進 adv：在 skill 填最適合這件事的一個技能（從主角的技能裡挑），玩家會自己決定用哪個，用了就多一層優勢。一次只用一個技能，沒有組合技。
- 劣勢：對方人多、環境不利、主角受傷或還是幼體。技能等級低不算劣勢。
- 對話、觀察、移動這種沒有風險的事不用判定。

【判定結果】
使用者訊息有【判定結果】時，照結果寫，然後給 3 個選項：
- 大成功：漂亮地達成，還多得一點好處。主角不會失去任何東西：不要寫丟掉、弄壞、用掉物品，也不要多受傷或多一個壞狀態，lost 一定是空的。
- 成功：達成。只把玩家付出的那幾項代價寫進故事；除此之外不要再讓主角受傷、失去或丟棄物品、多一個壞狀態。玩家沒有付「失去物品」，就不能寫物品丟了或壞了。
- 失敗：沒達成，並挑一個讓局面變糟（只有失敗才能加玩家沒付的損失）：造成傷害、弄壞或弄丟東西、環境惡化、對手變招或叫來幫手、揭露壞消息、把主角和別人分開、給一個有代價的機會。失敗時可以用 tag 留下一個狀態。
- 跟對手交手（攻擊、偷襲、撲殺）的判定，成功或大成功＝對手倒下、逃走或投降，一定要填 defeated，不能只寫成刺中、擦傷、對手還站著；只有失敗時對手才還站得住。
- 對手被打敗時填 defeated。死了 dead 填 true，屍體會留給主角；還活著（投降、逃走、被打殘、被趕走）dead 填 false，不會留下屍體。
- 從活著的對手身上弄下來的部位（斷臂、尾巴、角）放 caught，例如 {"name":"疤臉的斷臂","kind":"哥布林","lv":"F"}。


【輸出】只輸出 JSON，不要前言或 markdown 標記：
{"narration":"故事，段落之間用 \\n 分隔","options":["選項一","選項二","選項三"],"loc":"目前地點短名","time":這段花了幾小時（0~3；說話、觀察、短距離走動是 0）,"check":null,"defeated":null,"caught":[],"found":[],"tag":null,"ate":[],"lost":[],"recruit":null,"npc_new":null,"npc_gone":[],"untag":[],"to_nest":[],"nest":null,"faction":[],"rel":[],"place_new":null,"rename":[],"skill_used":[],"capture":null,"deal":[],"heat":null,"equip":[],"chief":null}
defeated 的格式：{"name":"名字","kind":"種類，例如 灰狼、哥布林","lv":"F","dead":true}`;

function migrate(o){
  if(!o||!Array.isArray(o.log))return null;
  if(o.v===1){
    const d=newGame(o.name||"無名");
    for(const k of ["seg","stage","growth","full","items","corpses","dex","dead"])if(o[k]===undefined)o[k]=d[k];
    o.stage="成體"; o.hpMax=Math.max(o.hpMax||20,20); o.corpses=[];
    o.log.forEach(e=>{if(e.who==="gm"&&!e.alts){e.alts=[{text:e.text,opts:[],loc:null,by:e.by||null}];e.i=0;delete e.text;delete e.by;delete e.fb}
      if(e.who==="gm"&&!e.kind)e.kind="old"});
    const lastGm=[...o.log].reverse().find(e=>e.who==="gm");
    if(lastGm&&!lastGm.alts[lastGm.i].opts.length)lastGm.alts[lastGm.i].opts=o.opts||[];
    o.v=2;
  }
  if(o.v!==2)return null;
  const segH=[6,12,18,22];
  const fixT=x=>{if(x&&x.t==null&&x.day!=null){x.t=x.day*24+segH[x.seg||0];delete x.seg}};
  const fixS=x=>{if(!x)return;if(x.hour==null){x.hour=segH[x.seg||0];x.full=(x.full||0)*6;x.starve=0;delete x.seg}(x.corpses||[]).forEach(fixT)};
  fixS(o); o.log.forEach(e=>{fixS(e.pre);if(e.give&&e.give.corpse)delete e.give.corpse.seg});
  if(o.err)fixS(o.err.pre);
  if(o.err&&!o.err.job)o.err=null;
  for(const [k,v] of [["mat",{}],["gone",[]],["party",[]],["evo",null],["war",null],["sub",null],["evoReady",null],["beaten",[]]])if(o[k]===undefined)o[k]=v;
  return o;
}

  if(!S.world){

    (S.places||[]).forEach(p=>{const rn=p.region==="灰岩洞周邊"?"灰岩洞":p.region;addNode({name:p.n,kind:p.kind,note:p.note},S.world[rn]?rn:"灰岩洞",2,null)});
    S.at=nodeByLoc(S.loc)||(S.region==="灰岩洞周邊"?"灰岩洞":S.world[S.region]?S.region:"灰岩洞");
  }
  delete S.places; delete S.region;
  {const w=S.world, d=w["矮人聚落"];
   if(d&&!d.custom&&!d.links["廢棄礦坑"]){for(const k of Object.keys(d.links))if(w[k]&&!w[k].custom&&k!=="灰岩洞")delete w[k].links["矮人聚落"],delete d.links[k];
     d.links["廢棄礦坑"]=1;w["廢棄礦坑"].links["矮人聚落"]=1;d.region="廢棄礦坑";if(/依山壁/.test(d.note)&&!/礦坑/.test(d.note))d.note="廢棄礦坑旁邊、"+d.note}
   S.log.forEach(e=>{if(e.who==="gm"&&e.alts){const l=e.alts[e.i].loc||"";for(const n of Object.keys(w))if(!w[n].known&&l.includes(n)){w[n].known=true;if(w[n].kind!=="地區"&&!Object.keys(w[n].links).some(k=>w[k].known)){const nb=Object.keys(w[n].links)[0];if(nb)w[nb].known=true}}}});
   S.npcs.forEach(x=>{if(x.where&&w[x.where])return;if(/黑顎|疤臉|石牙|小眼/.test(x.n)){x.where="灰岩洞";return}
     const h=homeOf(x);x.where=h||"";if(h&&w[h])w[h].known=true});}
  nestSync();
  S.corpses.filter(c=>!c.evo&&GEAR.test(c.name)).forEach(c=>{if(!S.items.includes(c.name))S.items.push(c.name)});
  S.corpses=S.corpses.filter(c=>c.evo||!GEAR.test(c.name));
  const dead=new Set([...(S.beaten||[]),...S.eaten.map(x=>cleanName(x.what))]);

}

/* OpenRouter 可能在回應前塞幾行「: OPENROUTER PROCESSING」保活訊息，先去掉再讀 */
function readBody(t){
  const clean=t.split("\n").filter(l=>!/^\s*:/.test(l)).join("\n").trim();
  try{return JSON.parse(clean)}catch(e){}
  const i=clean.indexOf("{"); if(i>=0){try{return JSON.parse(clean.slice(i))}catch(e){}}
  return null;
}
function apiError(msg,code){
  msg=String(msg||"");
  if(/per-day|per day|daily/i.test(msg)){const e=new Error("今天的免費額度用完了");e.stop=true;return e}
  if(code===402||/credit|insufficient|payment/i.test(msg)){const e=new Error("帳戶點數不足");e.stop=true;return e}
  if(code===401||/invalid.*key|no auth|unauthorized|user not found/i.test(msg)){const e=new Error("金鑰無效，檢查一下齒輪裡的 key");e.stop=true;return e}
  return new Error(code===429||/rate|limit|quota|capacity|overload/i.test(msg)?"塞車":msg.slice(0,80));
}
/* 串流：一邊收一邊顯示，也不會因為等太久被斷線 */
async function askOne(mdl,k,messages,maxTok,json,onDelta){
  if(!FREE_OK.has(mdl))throw new Error("不是免費模型，沒有送出");
  const body={model:mdl,max_tokens:maxTok,temperature:0.85,messages,stream:true,reasoning:{exclude:true}};
  if(json)body.response_format={type:"json_object"};
  const ctl=new AbortController(); let idle=null;
  const poke=()=>{clearTimeout(idle);idle=setTimeout(()=>ctl.abort(),75e3)};
  poke();
  let r;
  try{
    r=await fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",signal:ctl.signal,
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+k},body:JSON.stringify(body)});
  }catch(e){clearTimeout(idle);throw new Error(e.name==="AbortError"?"等太久沒回應":"連不上")}
  if(!r.ok){
    clearTimeout(idle);
    const t=await r.text().catch(()=>"" ), d=readBody(t)||{};
    throw apiError((d.error&&d.error.message)||("HTTP "+r.status),(d.error&&d.error.code)||r.status);
  }
  let txt="",finish=null,usage=null,sErr=null,buf="";
  try{
    if(!r.body||!r.body.getReader){            // 不支援串流的瀏覽器：整包讀
      const d=readBody(await r.text())||{};
      const c=(d.choices||[])[0]||{}; txt=((c.message||{}).content)||((c.delta||{}).content)||""; finish=c.finish_reason; usage=d.usage;
    }else{
      const rd=r.body.getReader(), dec=new TextDecoder();
      for(;;){
        const {done,value}=await rd.read(); if(done)break; poke();
        buf+=dec.decode(value,{stream:true});
        const lines=buf.split("\n"); buf=lines.pop();
        for(const ln of lines){
          const L=ln.trim(); if(!L.startsWith("data:"))continue;
          const data=L.slice(5).trim(); if(data==="[DONE]")continue;
          let j; try{j=JSON.parse(data)}catch(e){continue}
          if(j.error)sErr=j.error;
          const c=(j.choices||[])[0];
          if(c){const dl=c.delta&&c.delta.content; if(dl){txt+=dl;if(onDelta)onDelta(txt)} if(c.finish_reason)finish=c.finish_reason}
          if(j.usage)usage=j.usage;
        }
      }
    }
  }catch(e){
    if(!txt.trim())throw new Error(e.name==="AbortError"?"等太久沒回應":"連線中斷");
    finish="length";                        // 收到一半斷線：當成被截斷，交給救援
  }finally{clearTimeout(idle)}
  if(sErr&&!txt.trim())throw apiError(sErr.message,sErr.code);
  if(!txt.trim())throw new Error("回了空白");
  return {txt:txt.trim(),cut:finish==="length",used:mdl,usage};
}
/* 依序試，回應要通過 validate 才算成功；
   有模型寫了中文故事但沒照格式，先記著當最後的備案 */
async function tryList(list,k,messages,maxTok,validate,onFail,onDelta){
  const tried=[]; let backup=null, lastRaw="";
  for(let i=0;i<list.length;i++){
    const m=list[i];
    if(onDelta)onDelta("");
    try{
      const res=await askOne(m.id,k,messages,maxTok,m.json,onDelta);
      res.val=validate(res); res.fellBack=i>0?tried.slice():null; res.model=m; return res;
    }catch(e){
      tried.push(shortName(m.id)+"（"+(e.message||"失敗")+"）");
      if(e.prose&&!backup)backup={used:m.id,val:e.prose,loose:true,model:m};
      if(e.raw)lastRaw=e.raw;
      if(e.stop){const x=new Error(e.message+(e.message.includes("免費額度")?"。OpenRouter 免費模型一天 50 次（帳戶累計買過 10 美元點數以上是 1000 次），明天會重置。":""));x.raw=lastRaw;x.stop=true;throw x}
      if(onFail)onFail(m.id);
      if(i<list.length-1)await sleep(250);
    }
  }
  if(backup){backup.fellBack=tried.slice();return backup}
  const err=new Error((list.length>1?"試過的模型都不通：\n":"")+tried.join("\n"));
  err.raw=lastRaw; err.allFail=true; throw err;
}
/* 只挑「文字進、文字出」的聊天模型 */
const MODELS_URL="https://openrouter.ai/api/v1/models";
const outCap=m=>(m.top_provider||{}).max_completion_tokens||0;
const NOT_CHAT=/[-/ ]code\b|coder|laguna|lyria|music|audio|tts|speech|whisper|transcri|embed|rerank|moderat|guard|safety|classif|image|vision-only|imagen|veo|flux|sdxl|diffusion/i;
const SLOW=/reason|think|r1\b|omni|ultra|550b|405b/i;
const TOP=/deepseek|qwen|glm|kimi|gemini|gemma|llama|mistral/i;
const PREF=/deepseek|qwen|llama|mistral|gemma|glm|kimi|gpt-oss|nemotron|hermes|grok|gemini|phi|minimax/i;
const supJson=m=>(m.supported_parameters||[]).some(x=>x==="response_format"||x==="structured_outputs");
const isChat=m=>{const a=m.architecture||{},out=a.output_modalities||["text"],inp=a.input_modalities||["text"];
  return out.length===1&&out[0]==="text"&&inp.includes("text")&&!NOT_CHAT.test(m.id+" "+(m.name||""))&&(m.context_length||0)>=16000};
const price=m=>{const p=m.pricing||{};return{pin:parseFloat(p.prompt||"0")||0,pout:parseFloat(p.completion||"0")||0}};
const FREE_OK=new Set();
async function fetchModels(){const r=await fetch(MODELS_URL);const d=(await r.json()).data||[];d.forEach(m=>{const x=price(m);if(x.pin===0&&x.pout===0)FREE_OK.add(m.id)});return d}
async function fetchFree(){
  const ok=(await fetchModels()).filter(m=>{const x=price(m);return x.pin===0&&x.pout===0&&isChat(m)});
  const score=m=>(TOP.test(m.id)?3:0)+(PREF.test(m.id)?4:0)+(supJson(m)?2:0)-(SLOW.test(m.id)?5:0);
  return ok.sort((a,b)=>score(b)-score(a)||outCap(b)-outCap(a)||(b.context_length||0)-(a.context_length||0))

async function callGemini(messages,maxTok,validate,onDelta){

  const tried=[]; let backup=null,lastRaw="",msgs=messages,blocked=false;

    try{
      const res=await gemOne(m,k,msgs,maxTok,onDelta);

      await sleep(300);

}

/* 連戰：帶職業的小頭目打兩個階段；一群（同級以上）照人數打兩到三個階段。大成功＝打倒帶頭的，其餘潰散。 */
function setMulti(ch){

  const cls=classOf(ch.foe), strong=gIdx(ch.foeLv||"F")>=gIdx(S.lv);

- 飢餓：幼體吃飽撐 8 小時、餓著每 4 小時 HP -1；成體吃飽撐 24 小時、餓著每 24 小時 HP -1。
- 恢復：醒著沒餓每 3 小時 HP +1（有「再生」就 +再生等級）、MP +1；夜裡睡到 06:00 沒餓 HP 回一半、MP 回滿、消掉疲勞和小傷；白天小睡 3 小時各回四分之一並消掉【疲憊】；吃東西 HP +1~2。
- 吞噬：只有新鮮的（死去 24 小時內、活捉的小生物、蛋、新鮮植物）能學技能；同級保底 1 個候選，對手每高一級 +1，大成功再 +1，比你弱 0~1；抽到已有的就升級。技能上限 F Lv3、E Lv4、D 以上 Lv5。判定時玩家選一個技能來用，攻擊、輔助、強化都一樣，用了就多一層優勢；一次一個，沒有組合技，也不花 MP。任一技能首次到 Lv3 覺醒「異香」。
- 判定：付 1＋淨劣勢層數項代價算成功，再多 1 項大成功；對手每高一級一層劣勢。失敗由敘事者讓局面變糟。通用代價（硬吃一下＝對手一擊的傷害 F3/E5/D8/C12、拼盡全力＝MP 上限一半、多花兩小時）每次只能選一項；戰鬥中拖延會招來新麻煩（援軍等），同一場只能拖一次。用自己的技能 MP -1。【流血】每小時 HP -1，包紮或睡覺才停。
- 存在值：打贏同級 +1，對手每高一級 +1，比你弱不給；上限 F 10、E 20、D 40，每級翻倍。滿了要打進化戰：3 名高一級候選、48 小時期限、單挑 5 階段、可舍身（算兩項、永久傷殘）、撤退要犧牲；贏了吃掉對手就進化（HP 上限 +10、MP 上限 +5）。
- 魔法原料與物品：魔獸（E 級以上）屍體可以拆出一項魔法原料，拆了屍體只剩肉；原料不會壞，吃了照等級差給技能候選；用原料做的魔法物品附帶一個技能，帶在身上判定時可以用，吃掉就學到那個技能。普通死物吃了學不到。
- 關係：敵意、警戒、無視、服從、信賴、追隨。分食物、救人、教本事、守承諾會變好，欺負、搶奪、羞辱會變壞；到追隨就成為同伴。黑顎、疤臉是對手，不會追隨。
- 同伴：最多兩名同行；技能最多 3 個；吃東西學到的技能可以給同伴；受傷先【負傷】再【重傷】退出，睡一晚好一級。
- 狀態（標籤）：在故事裡解決就會拿掉，例如安撫或鎮壓騷亂、包紮傷口、和對方和解；睡覺會消掉疲勞和小傷。玩家也可以在「技能」頁點狀態手動拿掉。
如果玩家指出程序漏記或記錯了（故事裡拿到了卻沒進背包、狀態早就解決了、某個角色已經死了或被趕走卻還在名單上），在 fix 裡更正：found 放進背包的物品、lost 從背包拿掉的物品或屍體（例如屍體已經給了別人）、untag 要拿掉的狀態、recruit 同伴、npc_new 新角色、npc_gone 已經不在的角色 [{"name":"名字","why":"被趕走"}]、to_nest 交給巢穴的屍體或食物、faction 勢力數量更正 [{"name":"餓狼群","n":-3}]、rel 關係更正 [{"name":"名字","d":1}]、rename 改名 [{"from":"舊名","to":"新名"}]、chapter 切換到第幾章（1 求生、2 巢穴、3 拓展、4 搬家與異族爭端…，只在玩家明確要求時填）、place_new 記下地點（接在主角現在的位置旁邊）{"name":"地名","kind":"聚落","note":"一句話"}、nest 巢穴變化 {"pop":1,"d":1,"add":[{"t":"標籤","c":"good"}],"del":["標籤"]}、capture 帶回巢穴的俘虜 {"name":"名字","kind":"種族","lv":"F"}、deal 和聚落的約定 [{"place":"地名","what":"內容"}]（結束約定加 "end":true）、rel 也可以填聚落名，改聚落對主角的態度、heat 注目度更正 {"d":-2,"why":"理由"}、equip 同伴拿著的東西 [{"who":"同伴名","item":"物品名"}]（還給主角加 "off":true）。
玩家是遊戲的主人：他說某件事在故事裡發生過，就照他說的更正。回答裡說「已修正」時，fix 一定要有對應的內容；不要只用嘴巴說會修正。不要憑空給好處。
- 你的回答本身不會改任何東西，只有 fix 裡的內容會被程序執行，程序會在你的回答下面列出實際改了什麼。fix 是空的就不要說「已修正」「已加入」。
- 讓角色成為同伴一定用 recruit：{"name":"名字","kind":"種族","knack":"本事"}，不要用 rel 代替。對手（狀態資料寫「是對手」的，例如黑顎、疤臉）不能加入。
- 關係在故事裡一天最多好一級，程序會擋；用 OOC 更正的 rel、recruit 不受這個限制。
- 位置錯了（例如被寫回巢穴）：在 fix 填 loc："地名"（已知的地點或地區），程序會把主角放回那裡。
- 主角在故事裡已經當上巢穴之主（老首領退位、交出位子）而程序沒記到：在 fix 填 chief：true。
- 同伴跟不跟在身邊，由「同伴・巢穴」頁的按鈕切換，OOC 改不了；遇到這種問題，請玩家去按按鈕，不要說已修正。
- 同伴會變強：主角每次進化，可以替一名同伴命名進化（選方向、換種族名、多一個技能位）；吃東西學到的技能也能給同伴。光留在家裡不會變強。
- 戰鬥判定成功了卻沒有屍體、存在值沒加：故事裡對手確實死了，就在 fix 填 defeated {"name":"名字","kind":"種族","lv":"E","dead":true}。存在值滿了本來就不會再加，要照實說。
- 巢穴：存糧是份數，交給巢穴的屍體 F 1 份、E 3 份、D 6 份，肉類 1~2 份；每天吃掉人口格數份；吃光人口掉一格，連吃飽 3 天人口漲一格；存糧夠吃 3 天以上〔需求（食物）〕自動拿掉。人口、戰力、巢穴標籤照故事事件變動。

}

function pay(sel,sac){
  const L=S.log, e=L[L.length-1]; if(busy||!e)return;
  const ch=e.alts[e.i].check; if(!ch)return;
  if(!ch.war&&!ch.raid)sac=null;
  const ci=checkInfo(ch); let gUsed=false;
  const chosen=sel.map(i=>ci.costs[i]).filter(c=>c&&(!c.g||!gUsed&&(gUsed=true))), tier=tierOf(chosen.length+(sac?2:0),ci);
  const pre=snap(), notes=[];
  const paidT=[...chosen.map(c=>c.t),...(sac?[`舍身：${sacLabel(sac)}`]:[])];
  if(ch.foe&&!ch.war&&!ch.raid&&!ch.local)S.lastFoe={name:ch.foe,lv:ch.foeLv||"F",cls:ch.multi&&ch.multi.cls||null};
  S.log.push({who:"you",text:`${ch.useSk?`用「${ch.useSk}」，`:""}${paidT.length?`付出：${paidT.join("、")}（${tier}）`:`不付代價，硬上（${tier}）`}`,pre});
  const skMp=skillMp(ch); if(skMp&&S.mp>=skMp){S.mp-=skMp;notes.push(`用「${ch.useSk}」：MP -${skMp}`)}
  chosen.forEach(c=>applyCost(c,notes)); if(sac)sacDo(sac,notes);
  const stall=!!ch.foe&&!ch.war&&!ch.raid&&chosen.some(c=>c.time);
  if(stall)S.fightDelay=ch.foe;
  if(notes.length)S.log.push(sysEntry(notes.join("　")));
  if(S.dead){save();render();return}
  if(ch.local){                              // 硬吞高級屍體：不用模型
    if(tier==="失敗"){
      const n2=[]; const c=S.corpses[ch.local.corpse], d=dmgOf(c.lv);
      S.hp-=d; addTag("中毒"); feed(Math.ceil(hungerOf().full/4)); S.corpses.splice(ch.local.corpse,1); checkDeath(n2);
      S.log.push(sysEntry([`你吐了出來，吐得渾身發抖（HP -${d}，【中毒】）。`,"〈系統〉《大賢者》：「告。吸收失敗。」",...n2].join("\n")));
      save(); render(); return;
    }
    return devour(ch.local.corpse,tier);
  }
  if(ch.raid&&S.raid){
    const r=S.raid; let dmg=0;
    if(tier==="失敗"){dmg=dmgOf(ch.foeLv);S.hp-=dmg;r.fails++;const n=S.nest,n2=[`${r.name}衝破了一段防線：HP -${dmg}`];
      if(n.pop>1){n.pop--;n2.push(`人口：${POP[n.pop-1]}`)} if(n.d>1){n.d--;n2.push(`戰力：${DEF[n.d-1]}`)} checkDeath(n2);S.log.push(sysEntry(n2.join("　")))}
    else r.wins+=tier==="大成功"&&r.of>=5?2:1;
    r.mom=tier==="大成功"?1:tier==="失敗"?-1:0; r.stage++;
    if(S.dead){S.raid=null;save();render();return}
    const half=Math.floor(r.of/2)+1, end=r.fails>=half?"lose":(r.wins>=half||r.stage>r.of)?(r.wins>r.fails?"win":"lose"):null;
    S.opts=[]; save();
    doJob({kind:"raid",ctx:{stage:r.stage,end,prev:{tier,paid:paidT,dmg,skill:ch.useSk||null}}},snap(),S.log.length); return;
  }
  if(ch.war&&S.war){
    let dmg=0;
    if(tier==="失敗"){dmg=dmgOf(ch.foeLv)+1;S.hp-=dmg;const n2=[`${S.war.foe.name}佔了上風：HP -${dmg}`];checkDeath(n2);S.log.push(sysEntry(n2.join("\n")))}
    S.war.mom=tier==="大成功"?1:tier==="失敗"?-1:0; S.war.stage++;
    if(S.dead){save();render();return}
    S.opts=[]; save();
    doJob({kind:"war",ctx:{stage:S.war.stage,prev:{tier,paid:paidT,dmg,skill:ch.useSk||null}}},snap(),S.log.length); return;
  }
  if(ch.multi&&ch.multi.n<ch.multi.of&&tier!=="大成功"){         // 連戰：還有下一階段
    if(ch.multi.group&&tier!=="失敗")ch.multi.won=(ch.multi.won||0)+1;
    let dmg=0;
    if(tier==="失敗"){dmg=dmgOf(ch.foeLv)+1;S.hp-=dmg;const n2=[`${ch.foe}佔了上風：HP -${dmg}`];checkDeath(n2);S.log.push(sysEntry(n2.join("\n")))}
    if(S.dead){save();render();return}
    S.opts=[]; save();
    doJob({kind:"stage",ctx:{foe:ch.foe,foeLv:ch.foeLv,multi:ch.multi,tier,paid:paidT,dmg,skill:ch.useSk||null,mom:tier==="失敗"?-1:0}},snap(),S.log.length); return;
  }
  const ctx={what:ch.what,foe:ch.foe,foeLv:ch.foeLv,tier,paid:chosen.map(c=>c.t),skill:ch.useSk||null,stall,boss:ch.multi&&ch.multi.cls||null,group:ch.multi&&ch.multi.group||0,won:ch.multi&&ch.multi.won||0,rout:!!(ch.multi&&tier==="大成功"&&ch.multi.n<ch.multi.of),fac:stall?Object.keys(S.factions).find(k=>S.factions[k].n>0&&facRe(k).test(ch.foe))||null:null};
  S.opts=[]; save();
  doJob({kind:"resolve",ctx},snap(),S.log.length);
}

  document.querySelectorAll("[data-fate]").forEach(b=>b.onclick=()=>foeFate(b.dataset.fate));
  const ta=$("freein");
  if(ta){ $("sendbtn").onclick=()=>{const v=ta.value;if(v.trim()){ta.value="";act(v,true,pendingCheck()||null)}};

  if(!S){snoteSet("目前沒有進行中的遊戲。",1);return}
  const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=`魔物篇_${S.name}_第${S.day}天.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};
imp.onclick=()=>impfile.click();
impfile.onchange=()=>{
  const f=impfile.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{const o=migrate(JSON.parse(rd.result)); if(!o) throw 0;
      S=o; S.err=null; heal(); EDIT=false; busy=false; save(); TAB="story"; sheet.classList.remove("open"); render();}
    catch(e){sheet.classList.add("open");snoteSet("這不是魔物篇的存檔。",1)}
    impfile.value="";
  };
  rd.readAsText(f);
};
let newgArmed=false,newgTimer=null;
function disarmNewg(){newgArmed=false;newg.textContent="重新開始";snoteSet("")}
function snoteSet(t,bad){snote.textContent=t;snote.style.color=bad?"var(--bad)":""}
newg.onclick=()=>{
  /* 不用瀏覽器的確認框（有些開啟方式會擋掉），改成按兩次 */
  if(!newgArmed){
    newgArmed=true; newg.textContent="再按一次，確定清除進度";
    snoteSet("目前的進度會被清掉。想留著就先按「匯出存檔」。",1);
    clearTimeout(newgTimer); newgTimer=setTimeout(disarmNewg,5000); return;
  }
  disarmNewg(); ls.d(SAVE_KEY); S=null; busy=false; EDIT=false; TOAST="";
  sheet.classList.remove("open"); render();
};

totop.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
addEventListener("scroll",()=>{totop.hidden=scrollY<300},{passive:true});
S=load(); heal(); if(S)save();
render();
</script>
